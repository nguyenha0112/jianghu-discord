name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  bot-check:
    name: Bot Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install chat-bot dependencies
        working-directory: chat-bot
        run: npm ci

      - name: Check chat-bot
        working-directory: chat-bot
        run: npm run check

      - name: Install game-bot dependencies
        working-directory: game-bot
        run: npm ci

      - name: Verify game-bot gameplay and data flows
        working-directory: game-bot
        run: npm run verify

      - name: Verify process supervisor and alerts
        run: npm run check && npm run health:test && npm run alerts:test

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
